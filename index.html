<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أوردرات المصنع – عنوان الرخام</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#065A36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أوردرات المصنع">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #065A36; overflow: hidden; }
  body { font-family: Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff;
         padding-top: env(safe-area-inset-top); box-sizing: border-box; opacity: 0; transition: opacity .35s; }
  #app.ready { opacity: 1; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 26px; background: #065A36; color: #fff; transition: opacity .35s; z-index: 2; }
  #splash img { width: min(62vw, 300px); }
  #splash .t { font-size: 17px; letter-spacing: .5px; opacity: .9; }
  #splash .bar { width: 150px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #B59433; border-radius: 4px; animation: mv 1.1s ease-in-out infinite; }
  @keyframes mv { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
  #splash.gone { opacity: 0; pointer-events: none; }
  #retry { display: none; margin-top: 6px; background: #B59433; color: #fff; border: 0; border-radius: 10px;
           padding: 10px 22px; font: inherit; font-size: 15px; }
</style>
</head>
<body>
<div id="splash">
  <img src="logo-white.png" alt="عنوان الرخام">
  <div class="t">منظومة أوردرات المصنع</div>
  <div class="bar"><i></i></div>
  <button id="retry" onclick="location.reload()">إعادة المحاولة</button>
</div>
<iframe id="app" title="أوردرات المصنع" allow="camera; clipboard-write; fullscreen"></iframe>
<script>
  // لينك الأبليكيشن على جوجل (ثابت طول ما التحديث بيتعمل كـ New version على نفس الـ deployment)
  var EXEC = 'https://script.google.com/macros/s/AKfycbzvc0YitybUK_M9DzjFyVRRoMqX71zvApegpWoA16oouz-DLxgz6NX8ZBnqPLLB9rDT/exec';
  var FIXED_CODE = window.FIXED_CODE || '';   // بيتحدد في صفحة الشاشة بس

  var KEY = 'ma_factory_orders_k';
  var q = new URLSearchParams(location.search);
  var k = FIXED_CODE || q.get('k') || '';
  try {
    if (k) localStorage.setItem(KEY, k);
    else k = localStorage.getItem(KEY) || '';
  } catch (e) {}

  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  frame.addEventListener('load', function () {
    frame.classList.add('ready');
    setTimeout(function () { splash.classList.add('gone'); }, 150);
  });
  // لو النت ضعيف وماحملش بعد ٢٠ ثانية، يظهر زرار إعادة المحاولة
  setTimeout(function () {
    if (!frame.classList.contains('ready')) document.getElementById('retry').style.display = 'inline-block';
  }, 20000);
  frame.src = EXEC + (k ? '?k=' + encodeURIComponent(k) : '');
</script>
</body>
</html>
